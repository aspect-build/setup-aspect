name: 'Setup Aspect CLI'
description: 'Install the Aspect CLI launcher and configure Bazel for GitHub Actions.'
author: 'Aspect Build'

branding:
  icon: 'triangle'
  color: 'gray-dark'

inputs:
  launcher-version:
    description: |
      Aspect CLI launcher version to install (e.g. `2026.38.24`). Omit
      to install the latest released launcher.

      The CLI version itself is pinned by `.aspect/version.axl` in
      your repo — the launcher reads that file and downloads the
      matching CLI on first `aspect` invocation, so local and CI stay
      in sync without a launcher-version bump.

      Ignored when running on an Aspect Workflows runner (the
      runner image already has `aspect` on PATH) or when
      `launcher-install` is `false`.
    required: false
    default: ''

  launcher-install:
    description: |
      Whether to install the Aspect CLI launcher. Default `true`.

      Set to `false` if you're providing the `aspect` binary
      yourself (e.g. via a `curl install.aspect.build | bash` step
      earlier in the job, or by building it from source). In that
      mode setup-aspect skips the launcher install entirely; you
      are responsible for putting `aspect` on PATH before any
      later step that needs to invoke it.

      When combined with `aspect-api-token`, the auth step still
      runs and will fail unless an `aspect` binary is already on
      PATH at the time setup-aspect runs. If `aspect` won't be on
      PATH until later, leave `aspect-api-token` empty too and run
      `aspect auth login` from a later step.

      No-op on Aspect Workflows runners (the runner image already
      provides `aspect`, so the launcher install is skipped
      regardless).
    required: false
    default: 'true'

  aspect-api-token:
    description: |
      Long-lived `<CLIENT_ID>:<SECRET>` Aspect API token, typically
      passed via the GitHub Actions secrets context as
      `secrets.ASPECT_API_TOKEN`. When set, setup-aspect pipes it
      into `aspect auth login --with-api-token`; the resulting
      short-lived JWT is persisted locally so downstream
      `aspect <task>` calls pick it up automatically via
      `ctx.aspect.auth.credentials()`.

      The long-lived token is **not** exported to `GITHUB_ENV` for
      subsequent steps — only the JWT (on disk) is visible to
      downstream actions.

      Setting this input runs `aspect auth login` as part of the
      setup-aspect step. Leave empty to skip the auth step (for
      example if you want to authenticate later in the job, or your
      workflow doesn't need Aspect API access).
    required: false
    default: ''

  bazelisk-version:
    description: |
      Bazelisk version to install (semver range or exact, e.g.
      `1.x` or `1.21.0`). Defaults to `latest` — the most recent
      non-prerelease published to bazelbuild/bazelisk.

      The install is skipped (regardless of this input) when `bazel`
      is already on PATH (for example because setup-bazel ran first
      or you're on an Aspect Workflows runner image, which ships its
      own Bazelisk).
    required: false
    default: 'latest'

  bazelisk-cache:
    description: |
      Cache the Bazelisk binary across runs (keyed on
      `.bazelversion`). On by default — set to `false` to disable.

      Ignored on Aspect Workflows runners.
    required: false
    default: 'true'

  remote-cache:
    description: |
      Point `~/.bazelrc` at the Aspect deployment's remote cache and
      BES, by running `aspect setup bazelrc`. On by default.

      This is what makes a plain `bazel build //...` read and write a
      cache shared across jobs and branches, and stream the build to
      Aspect, without the workflow configuring anything else. The
      deployment defaults to Aspect Cloud; set `aspect-api-token` so
      Bazel can authenticate to it, and to give a single-tenant
      deployment its own `--config` section in the generated rc.

      The rc is written to `~/.aspect/bazelrc` and `try-import`ed from
      `~/.bazelrc`, rather than into the checkout, so the repository is
      left clean.

      Set to `false` if you configure Bazel's remote cache yourself, or
      to keep setup-aspect from touching `~/.bazelrc`. With it off you
      will usually want `disk-cache: true` so the job still caches
      something.

      Ignored on Aspect Workflows runners, which generate their own rc
      pointing at the runner's services.
    required: false
    default: 'true'

  remote:
    description: |
      Which of the deployment's remote endpoints the generated rc turns
      on, passed to `aspect setup bazelrc` as `--remote=<value>`. Unset
      by default, which leaves the CLI's own `auto`: the remote cache
      and BES on CI, and nothing off it.

      Same grammar as `aspect build --remote`. `exec` adds remote
      execution, which is never automatic. `no-cache` / `no-bes` /
      `no-exec` subtract, so `no-bes` is the cache alone. `none` enables
      nothing. `auto` is the default spelled out.
    required: false
    default: ''

  home:
    description: |
      Which rc `aspect setup bazelrc` writes, passed as `--home=<value>`.
      Unset by default, which leaves the CLI's own `auto`: the machine's
      rc under `~/.aspect` on CI, and the checkout's off it.

      `false` writes the checkout's `<workspace>/.aspect/bazelrc` and a
      `try-import` into the repository's `.bazelrc` instead — files meant
      to be committed, so this is for a job whose purpose is regenerating
      them. `true` forces the machine's rc.
    required: false
    default: ''

  force:
    description: |
      Regenerate the rc even if one is already there, passing `--force`.
      Off by default, because the CLI keeps an existing rc: the
      checkout's is the repository's to edit, and the machine's may
      belong to a runner someone set up by hand.

      Worth turning on for a persistent self-hosted runner, whose home
      directory survives between jobs and would otherwise keep the rc
      written by the first job on it. An ephemeral runner starts clean,
      so this changes nothing there.
    required: false
    default: 'false'

  disk-cache:
    description: |
      Cache `--disk_cache` outputs across runs, through the GitHub
      Actions cache. **Off by default** — the `remote-cache` above
      covers the same ground and is shared across jobs, branches, and
      developers, where this one is per-runner and capped by the GHA
      cache's 10 GB per-repository budget.

      Set to `true` to re-enable it, or to a string to segregate the
      cache by that key — a typical pattern is to key on the GitHub
      Actions workflow context's `github.workflow` value so each
      workflow gets its own cache. `false` keeps it off.

      Turning it on alongside `remote-cache` is supported and gives
      Bazel a local tier in front of the remote one; it is the right
      setting when `remote-cache` is off.

      Ignored on Aspect Workflows runners — they route Bazel through
      a remote cache, making per-job disk caching unnecessary.
    required: false
    default: 'false'

  repository-cache:
    description: |
      Enable Bazel `--repository_cache` (external-repo download
      bytes). On by default. Set to a string to segregate the cache
      by that key — a typical pattern is to key on the GitHub Actions
      workflow context's `github.workflow` value so each workflow gets
      its own cache. Set to `false` to disable entirely.

      Ignored on Aspect Workflows runners.
    required: false
    default: 'true'

  bazelrc:
    description: |
      Extra lines appended to `~/.bazelrc`. Multiline YAML strings
      are supported. setup-aspect appends only lines not already
      present, so re-runs are idempotent.

      Appended after `remote-cache` has generated the rc, so these
      lines override the generated ones where they set the same flag.

      Ignored on Aspect Workflows runners (the runner provides
      its own Bazel configuration).
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
  post-if: '!cancelled()'
